[package]
name = "citenexus-core"
version = "0.13.1"
edition = "2021"
description = "CiteNexus's Rust engine: extraction (pdf/docx/pptx/xlsx/html/md/csv/txt), any-format→markdown emission, lance store access, lid.176 detection. One core, FFI for all languages (SPEC-PORTS-v1 §3.4)."
license = "Apache-2.0"
repository = "https://github.com/muthuishere/citenexus"
readme = "README.md"
keywords = ["rag", "retrieval", "extraction", "lancedb", "ffi"]
categories = ["text-processing"]

[lib]
name = "citenexus_core"
# cdylib: the C-ABI artifact every language binds (cgo / napi / pyo3 / ctypes).
# rlib: normal Rust consumption + tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# extract: html (browser-grade html5ever), markdown (CommonMark reference),
# OOXML docx/pptx (zip + streaming xml), xlsx (calamine), csv.
scraper = "0.27"
calamine = { version = "0.36", features = ["dates"] }
ego-tree = "0.11"
pulldown-cmark = "0.13"
quick-xml = "0.41"
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
# pdf is feature-gated: pdfium-render binds libpdfium dynamically at runtime,
# so the crate always compiles; enabling the feature adds the binding code.
# 0.9.4: double-free fixes in font and page-object handling. 0.9.3 is the
# first release that compiles where c_char is unsigned (linux/aarch64). 0.9.4
# keeps PdfiumLibraryBindingsAccessor crate-private, so raw.rs binds the
# library twice before Pdfium::new and keeps one binding for FPDFText_*.
pdfium-render = { version = "=0.9.4", optional = true }
# store: LanceDB (async Rust API — a small tokio runtime lives inside LanceStore;
# the C ABI stays synchronous). arrow-* pinned to lancedb's arrow major (58).
lancedb = "0.30"
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
arrow-array = "58"
arrow-schema = "58"
arrow-json = "58"
# detect: fastText lid.176 via the pure-Rust fasttext crate (parses the
# upstream binary format, dense + quantized). Exact spec model — parity with
# Python.
fasttext = "0.8"
tree-sitter = "0.26"
# checks: NFKC before comparing model text with a text layer (already in the
# lock via lance).
unicode-normalization = "0.1"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"

[features]
default = []
pdf = ["dep:pdfium-render"]

[profile.release]
lto = true
strip = true

# Fast optimised builds for the counts-only measurement examples.
[profile.measure]
inherits = "release"
lto = false
codegen-units = 16

[dev-dependencies]
tempfile = "3.27.0"
# tests/pdf_contract_schema_test.rs: validates the committed contract fixtures
# against docs/schema/pdf-model-contract.schema.json (draft 2020-12).
# MIT OR Apache-2.0; test-only, never in the shipped library.
boon = "0.6"
# tests/pdf_bind_order_test.rs: another pdfium-render user binding first.
pdfium-render = "=0.9.4"

[[example]]
name = "pdf_measure"
required-features = ["pdf"]

[[example]]
name = "pdf_headings"
required-features = ["pdf"]

[[example]]
name = "pdf_tables"
required-features = ["pdf"]

[[example]]
name = "pdf_furniture"
required-features = ["pdf"]
